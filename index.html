<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PCB Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header, footer {
      padding: 1rem 1.5rem;
      background: #f2f2f2;
    }
    main {
      flex: 1;
      padding: 1rem 1.5rem;
    }
    iframe {
      width: 100%;
      height: 80vh;
      border: none;
    }
    .btn {
      display: inline-block;
      padding: 0.75rem 1.25rem;
      border-radius: 4px;
      border: 1px solid #333;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <header>
    <h1>My PCB Project</h1>
  </header>

  <main>
    <h2>Embedded Altium 365 Viewer</h2>

    <iframe src="https://personal-viewer.365.altium.com/client/index.html?feature=embed&source=BFD99625-0B81-47B0-8068-4DE407599296&activeView=3D" width="1280" height="720" style="overflow:hidden;border:none;width:100%;height:720px;" scrolling="no" allowfullscreen="true" onload="window.top.scrollTo(0,0);"></iframe>
    
    
  </main>

  <footer>
    <small>Hosted with GitHub Pages</small>
  </footer>
</body>
</html>
